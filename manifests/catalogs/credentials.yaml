credentials:
  - id: litellm-jarod-laptop
    reference: op://holdfast-lan/opencode-litellm-jarod-laptop-api-key/credential
    inject_as: LITELLM_API_KEY

providers:
  - id: opencode-cloud
    type: opencode
    builtin: true
    base_url: https://opencode.ai/zen/v1
    note: Built-in OpenCode Zen provider (connect via opencode auth login; key stored in auth.json)
  - id: amd-halo
    type: opencode
    base_url: http://amd-halo.holdfast.lan:13305/api/v1
    credentials:
      - id: amd-halo-api-key
        reference: op://holdfast-lan/lemonade api key/credential
        inject_as: LEMONADE_API_KEY
  - id: openrouter
    type: opencode
    base_url: http://192.168.1.181:4000/v1
    credentials:
      - id: litellm-jarod-laptop
        reference: op://holdfast-lan/opencode-litellm-jarod-laptop-api-key/credential
        inject_as: LITELLM_API_KEY

# MCP servers authenticate with the single gateway virtual key
# (LITELLM_API_KEY, declared above) - there are no per-server keys.
mcp-servers:
  - id: github
    url: http://192.168.1.181:4000/mcp/github
  - id: halo-commander
    url: http://192.168.1.181:4000/mcp/halo_commander
  - id: playwright
    url: http://192.168.1.181:4000/mcp/playwright

skills:
  - id: file-search
    name: File Search
    description: Search for files and content
    version: 1.0.0
    source: opencode
    dependencies: []
    checksum: ""
    owner: holdfast-team
    purpose: development
